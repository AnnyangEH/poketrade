<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레이드 패스 카운터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-2">
      <h1 class="text-xl font-bold tracking-tight">레이드 패스 카운터</h1>
      <button id="phase-toggle-btn" class="px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 hover:bg-blue-500 transition-colors"></button>
    </header>

    <p class="text-xs text-gray-500 mb-5 leading-relaxed">
      클릭: 선택/해제 &nbsp;·&nbsp; <span class="text-gray-300 font-semibold">Space</span>: 선택 계정 +1 &nbsp;·&nbsp;
      <span class="text-gray-300 font-semibold">Ctrl</span>: 선택 계정 -1 &nbsp;·&nbsp;
      <span class="text-gray-300 font-semibold">Esc</span>: 선택 해제
    </p>

    <div id="account-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
