<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬GO 거래 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 로그인 오류 표시 (익명 인증 실패 시에만 노출) -->
  <div id="auth-error" class="hidden fixed inset-0 bg-white z-50 flex-col items-center justify-center gap-3 text-center p-6">
    <p class="text-4xl mb-1">⚠️</p>
    <p class="font-bold text-gray-700">로그인에 실패했습니다.</p>
    <p class="text-sm text-gray-500 max-w-xs">Firebase 콘솔 &gt; Authentication &gt; Sign-in method에서 "Anonymous" 제공자가 활성화되어 있는지 확인해주세요.</p>
    <p id="auth-error-detail" class="text-xs text-gray-400 mt-2 break-all max-w-xs"></p>
  </div>

  <!-- 메인 앱 -->
  <div id="app" class="hidden">

    <!-- 헤더 / 메인 탭 -->
    <div class="bg-white shadow-sm sticky top-0 z-20">
      <div class="max-w-3xl mx-auto px-3">
        <div class="relative">
          <h1 class="text-lg font-extrabold text-center pt-3 pb-1 tracking-tight text-blue-700">⚡ 포켓몬GO 거래 관리</h1>
        </div>
        <div class="flex">
          <button onclick="switchTab('inventory')"   id="tab-inventory"   class="tab-btn active flex-1 py-2.5 text-xs font-semibold">📦 재고</button>
          <button onclick="switchTab('ledger')"      id="tab-ledger"      class="tab-btn flex-1 py-2.5 text-xs font-semibold">📒 장부</button>
          <button onclick="switchTab('reservation')" id="tab-reservation" class="tab-btn flex-1 py-2.5 text-xs font-semibold">📅 예약</button>
          <button onclick="switchTab('dashboard')"   id="tab-dashboard"   class="tab-btn flex-1 py-2.5 text-xs font-semibold">📊 대시보드</button>
        </div>
      </div>
    </div>

    <!-- 재고 탭 -->
    <div id="section-inventory" class="section max-w-3xl mx-auto px-3 py-4 space-y-3">
      <button id="price-search-open-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white rounded-lg py-2 text-sm font-bold">💰 시세 검색</button>
      <div class="bg-white rounded-xl shadow p-3">
        <div id="inventory-filters"></div>
      </div>
      <div id="inventory-add-results" class="hidden"></div>
      <div id="inventory-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      <p id="inventory-empty" class="text-center text-gray-400 py-10 text-sm hidden">보관함이 비어 있습니다. 검색해서 추가해보세요.</p>
    </div>

    <!-- 장부 탭 (거래내역) -->
    <div id="section-ledger" class="section hidden max-w-3xl mx-auto px-3 py-4 space-y-3">
      <div class="bg-white rounded-xl shadow p-4 space-y-2">
        <p class="font-bold text-sm mb-1">거래 입력</p>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">날짜</label>
            <input type="date" id="form-date" class="border rounded-lg px-2 py-1.5 text-sm w-full">
          </div>
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">품목 (보관함에서 선택)</label>
            <select id="form-item" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white"></select>
          </div>
        </div>
        <div class="flex flex-col gap-0.5">
          <label class="text-xs text-gray-500">메모</label>
          <input type="text" id="form-memo" placeholder="메모 (선택)" class="border rounded-lg px-2 py-1.5 text-sm w-full">
        </div>
        <button onclick="addEntry()" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-bold mt-1">저장</button>
      </div>
      <div class="bg-white rounded-xl shadow overflow-x-auto">
        <table class="w-full text-xs min-w-[360px]">
          <thead class="bg-gray-50 text-gray-500 uppercase text-[11px]">
            <tr>
              <th class="px-3 py-2 text-left">날짜</th>
              <th class="px-2 py-2 text-left">품목</th>
              <th class="px-2 py-2 text-left">메모</th>
              <th class="px-2 py-2 text-left">상태</th>
              <th class="px-2 py-2"></th>
            </tr>
          </thead>
          <tbody id="ledger-tbody" class="divide-y divide-gray-100"></tbody>
        </table>
        <p id="ledger-empty" class="text-center text-gray-400 py-6 text-sm hidden">거래 내역이 없습니다.</p>
      </div>
    </div>

    <!-- 대시보드 탭 -->
    <div id="section-dashboard" class="section hidden max-w-3xl mx-auto px-3 py-4 space-y-4">
      <div class="bg-white rounded-xl shadow p-3 text-center max-w-[200px] mx-auto">
        <p class="text-xs text-gray-400 mb-0.5">총보유수량</p>
        <p id="dash-qty" class="text-3xl font-extrabold text-blue-700">0</p>
        <p class="text-xs text-gray-400">마리</p>
      </div>
    </div>

    <!-- 예약 탭 -->
    <div id="section-reservation" class="section hidden max-w-3xl mx-auto px-3 py-4 space-y-4">
      <div class="bg-white rounded-xl shadow p-4 space-y-2">
        <p class="font-bold text-sm mb-1">예약 추가</p>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">구매자</label>
            <input type="text" id="res-buyer" placeholder="구매자 이름" class="border rounded-lg px-2 py-1.5 text-sm w-full">
          </div>
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">플랫폼</label>
            <select id="res-platform" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white">
              <option value="당근">당근</option>
              <option value="번개">번개장터</option>
              <option value="중고">중고나라</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">품목 (보관함에서 선택)</label>
            <select id="res-item" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white"></select>
          </div>
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">친구시작일</label>
            <input type="date" id="res-friendStart" onchange="updateTradeDate()" class="border rounded-lg px-2 py-1.5 text-sm w-full">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">친구타입</label>
            <select id="res-friendType" onchange="updateTradeDate()" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white">
              <option value="">선택</option>
              <option value="그레이트">그레이트 (+7일)</option>
              <option value="울트라">울트라 (+30일)</option>
              <option value="즉시">즉시 (오늘)</option>
            </select>
          </div>
          <div class="flex flex-col gap-0.5">
            <label class="text-xs text-gray-500">거래예정일 <span class="text-blue-500">(자동계산)</span></label>
            <input type="date" id="res-tradeDate" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-gray-50">
          </div>
        </div>
        <div class="flex flex-col gap-0.5">
          <label class="text-xs text-gray-500">메모</label>
          <input type="text" id="res-notes" placeholder="메모 (선택)" class="border rounded-lg px-2 py-1.5 text-sm w-full">
        </div>
        <button onclick="addReservation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-bold mt-1">예약 추가</button>
      </div>

      <div class="bg-white rounded-xl shadow p-3">
        <p class="text-sm font-bold mb-2" id="cal-title">달력</p>
        <div class="grid grid-cols-7 gap-0.5 mb-1">
          <div class="text-center text-[11px] text-gray-400 font-medium py-0.5">월</div>
          <div class="text-center text-[11px] text-gray-400 font-medium py-0.5">화</div>
          <div class="text-center text-[11px] text-gray-400 font-medium py-0.5">수</div>
          <div class="text-center text-[11px] text-gray-400 font-medium py-0.5">목</div>
          <div class="text-center text-[11px] text-gray-400 font-medium py-0.5">금</div>
          <div class="text-center text-[11px] text-blue-400 font-medium py-0.5">토</div>
          <div class="text-center text-[11px] text-red-400 font-medium py-0.5">일</div>
        </div>
        <div id="cal-grid" class="grid grid-cols-7 gap-0.5"></div>
        <div class="flex gap-3 mt-2 text-[10px] text-gray-400 justify-end">
          <span><span style="display:inline-block;width:10px;height:10px;background:#f3f4f6;border-radius:2px;vertical-align:middle"></span> 0건</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:rgba(239,68,68,0.3);border-radius:2px;vertical-align:middle"></span> 1건</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:rgba(239,68,68,0.6);border-radius:2px;vertical-align:middle"></span> 2건+</span>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow p-3">
        <p class="text-sm font-bold mb-2">📋 임박 예약 <span id="res-count" class="text-xs text-gray-400 font-normal ml-1"></span></p>
        <div id="upcoming-list" class="divide-y divide-gray-100"></div>
        <p id="upcoming-empty" class="text-center text-gray-400 py-4 text-sm hidden">활성 예약이 없습니다.</p>
      </div>
    </div>

  </div><!-- /app -->

  <!-- 시세 검색 모달 -->
  <div id="price-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-base">💰 시세 검색</h3>
        <button id="price-modal-close" class="text-gray-400 hover:text-gray-600 text-xl leading-none">×</button>
      </div>

      <div id="price-step-select">
        <input type="text" id="price-search-input" placeholder="이름 / 번호 / 폼 / 이벤트 검색" class="border rounded-lg px-2 py-1.5 text-sm w-full mb-2">
        <div id="price-search-results" class="space-y-1 max-h-72 overflow-y-auto"></div>
      </div>

      <div id="price-step-lookup" class="hidden space-y-2">
        <button id="price-back-btn" class="text-xs text-gray-400">← 다시 검색</button>
        <p id="price-selected-label" class="font-semibold text-sm"></p>
        <select id="price-background-select" class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white"></select>
        <button id="price-lookup-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-bold">시세 조회</button>
        <div id="price-result" class="hidden text-center space-y-1 pt-2 border-t">
          <p class="text-xs text-gray-400">평균 시세</p>
          <p id="price-result-avg" class="text-2xl font-extrabold text-blue-700"></p>
          <p id="price-result-count" class="text-[11px] text-gray-400"></p>
          <button id="price-add-btn" class="w-full bg-green-600 hover:bg-green-700 text-white rounded-lg py-2 text-sm font-bold mt-2">보관함에 추가</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
