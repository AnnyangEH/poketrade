<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도감번호 추첨기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-6 space-y-5">
    <header>
      <h1 class="text-xl font-bold tracking-tight">도감번호 추첨기</h1>
    </header>

    <div id="settings-panel" class="bg-gray-900 rounded-xl p-4 space-y-3">
      <p class="text-sm font-bold">당첨 도감번호 설정</p>
      <div class="flex flex-wrap items-center gap-2">
        <input type="number" id="win-1" min="1" max="1025" class="w-24 bg-gray-800 rounded-lg px-2 py-1.5 text-sm text-center" placeholder="151">
        <input type="number" id="win-2" min="1" max="1025" class="w-24 bg-gray-800 rounded-lg px-2 py-1.5 text-sm text-center" placeholder="445">
        <input type="number" id="win-3" min="1" max="1025" class="w-24 bg-gray-800 rounded-lg px-2 py-1.5 text-sm text-center" placeholder="886">
        <button id="save-winners-btn" class="bg-blue-600 hover:bg-blue-500 rounded-lg px-4 py-1.5 text-sm font-bold">저장</button>
      </div>
    </div>
    <div id="settings-collapsed" class="hidden items-center gap-2 text-xs text-gray-400">
      <span>당첨번호 설정 완료</span>
      <button id="edit-winners-btn" class="text-blue-400 hover:text-blue-300 font-semibold">수정</button>
    </div>

    <div id="winner-ref-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-2"></div>

    <div class="bg-gray-900 rounded-xl p-4 space-y-3">
      <p class="text-sm font-bold">댓글 붙여넣기</p>
      <textarea id="paste-area" rows="6" class="w-full bg-gray-800 rounded-lg px-3 py-2 text-xs font-mono" placeholder="디시 댓글 영역을 통째로 복사해서 여기 붙여넣으세요"></textarea>
      <div class="flex items-center gap-3">
        <button id="parse-btn" class="bg-green-600 hover:bg-green-500 rounded-lg px-4 py-1.5 text-sm font-bold">파싱하기</button>
        <p id="parse-summary" class="text-xs text-gray-400"></p>
      </div>
    </div>

    <div id="chart-card" class="hidden bg-gray-900 rounded-xl p-4">
      <p class="text-sm font-bold mb-3">가장 많이 나온 번호</p>
      <div class="flex flex-col sm:flex-row items-center gap-4">
        <div class="relative w-48 h-48 flex-shrink-0">
          <svg id="chart-svg" viewBox="0 0 200 200" class="w-full h-full"></svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <span id="chart-total" class="text-xl font-extrabold"></span>
            <span class="text-[10px] text-gray-500">응모</span>
          </div>
        </div>
        <div id="chart-legend" class="flex-1 w-full grid grid-cols-2 sm:grid-cols-1 gap-x-3 gap-y-1 text-xs"></div>
      </div>
    </div>
    <div id="chart-tooltip" class="hidden fixed z-50 bg-gray-800 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs pointer-events-none"></div>

    <div id="entry-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-2"></div>
    <p id="entry-empty" class="text-center text-gray-500 py-10 text-sm">아직 파싱된 댓글이 없습니다.</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
